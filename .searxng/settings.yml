use_default_settings:
  engines:
    keep_only:
      - wikipedia
      - arxiv
      - github
      - stackoverflow
      - wikidata
      - duckduckgo
      - duckduckgo news

general:
  instance_name: "Thanarah Local SearXNG"

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "thanarah-local-development-searxng-key"
  image_proxy: false
  http_protocol_version: "1.1"
  limiter: false

search:
  safe_search: 1
  formats:
    - html
    - json