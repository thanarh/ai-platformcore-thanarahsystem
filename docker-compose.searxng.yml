services:
  searxng:
    image: searxng/searxng:latest
    container_name: thanarah-searxng
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    environment:
      GRANIAN_HOST: "0.0.0.0"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
    volumes:
      - ./.searxng:/etc/searxng:ro
    restart: unless-stopped