services:
  - type: web
    name: thanarah-ai
    runtime: node
    plan: 12c-24g
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    healthCheckPath: /
    autoDeploy: true
    # Optional persistent model storage (currently billed separately by Render).
    # Enable this after approving the additional storage charge:
    # disk:
    #   name: thanarah-models
    #   mountPath: /var/data
    #   sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: WEB_CONCURRENCY
        value: 1
      - key: API_PORT
        value: 3001
      - key: AI_ENGINE_PORT
        value: 8000
      - key: NEXT_API_URL
        value: http://127.0.0.1:3001
      - key: AI_ENGINE_URL
        value: http://127.0.0.1:8000
      - key: LOCAL_AI_MODE
        value: auto
      - key: LOCAL_AI_MIN_MEMORY_GB
        value: 12
      - key: LOCAL_AI_REQUIRED
        value: true
      - key: LOCAL_AI_MODEL
        value: qwen2.5:7b
      - key: LOCAL_AI_KEEP_ALIVE
        value: "-1"
      - key: LOCAL_AI_NUM_CTX
        value: 4096
      - key: LOCAL_AI_NUM_THREAD
        value: 6
      - key: LOCAL_AI_NUM_BATCH
        value: 128
      - key: LOCAL_AI_MAX_CONCURRENCY
        value: 1
      - key: LOCAL_AI_MAX_QUEUE
        value: 32
      - key: LOCAL_AI_QUEUE_TIMEOUT_SECONDS
        value: 180
      - key: LOCAL_AI_MAX_TOKENS_FAST
        value: 128
      - key: LOCAL_AI_MAX_TOKENS_BALANCED
        value: 384
      - key: LOCAL_AI_MAX_TOKENS_DEEP
        value: 768
      - key: OLLAMA_NUM_PARALLEL
        value: 1
      - key: OLLAMA_MAX_QUEUE
        value: 128
      - key: PERSISTENT_RESPONSE_CACHE_ENABLED
        value: true
      - key: PERSISTENT_RESPONSE_CACHE_TTL_SECONDS
        value: 604800
      - key: RESPONSE_CACHE_SIZE
        value: 2048
      - key: RESPONSE_CACHE_TTL_SECONDS
        value: 21600
      - key: RESPONSE_CACHE_PROMPT_TTL_SECONDS
        value: 604800
      - key: RESPONSE_CACHE_SEMANTIC_MIN_SCORE
        value: 0.92
      - key: EXTERNAL_AI_ENABLED
        value: false
      - key: EXTERNAL_AI_API_KEY
        sync: false
      - key: EXTERNAL_AI_BASE_URL
        value: https://api.openai.com/v1
      - key: EXTERNAL_AI_MODEL
        value: ""
      - key: EXTERNAL_AI_MAX_TOKENS_FIELD
        value: max_tokens
      - key: EXTERNAL_AI_MAX_RETRIES
        value: 2
      - key: EXTERNAL_AI_MAX_CONCURRENCY
        value: 16
      - key: EXTERNAL_AI_DAILY_LIMIT
        value: 50000
      - key: EXTERNAL_AI_RPM_LIMIT
        value: 300
      - key: EXTERNAL_AI_DAILY_BUDGET_USD
        value: 10
      - key: EXTERNAL_AI_INPUT_PRICE_PER_MILLION
        value: 0
      - key: EXTERNAL_AI_OUTPUT_PRICE_PER_MILLION
        value: 0
      - key: EXTERNAL_AI_MAX_TOKENS_FAST
        value: 256
      - key: EXTERNAL_AI_MAX_TOKENS_BALANCED
        value: 768
      - key: EXTERNAL_AI_MAX_TOKENS_DEEP
        value: 1600
      - key: FREE_PROVIDER_ONLY
        value: true
      - key: FREE_PROVIDERS_ENABLED
        value: false
      - key: ALLOW_EXTERNAL_PROVIDERS
        value: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
